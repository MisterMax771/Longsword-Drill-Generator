<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KdF Creative Drill Prompt Generator</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2c2c2c;
            --accent: #ff9800;
            --accent-hover: #e68a00;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            padding: 25px 15px; 
            max-width: 500px; 
            margin: 0 auto; 
            line-height: 1.5;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 { 
            color: var(--accent); 
            font-size: 1.7rem; 
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 24px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
            border: 1px solid var(--border-color);
        }

        button { 
            width: 100%;
            padding: 14px; 
            border-radius: 8px; 
            border: none; 
            font-size: 1.1rem; 
            background: var(--accent); 
            color: #121212; 
            font-weight: 700; 
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { 
            background: var(--accent-hover); 
        }

        button:active {
            transform: scale(0.98);
        }

        .prompt-container {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .prompt-box {
            background: #252525;
            border: 1px solid #333;
            border-left: 5px solid var(--accent);
            border-radius: 8px;
            padding: 14px 16px;
        }

        .prompt-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .prompt-value {
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
        }

        .challenge-note {
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 152, 0, 0.08);
            border: 1px dashed var(--accent);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.88rem;
            text-align: center;
        }

        .copy-btn {
            margin-top: 15px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 10px;
        }

        .copy-btn:hover {
            background: var(--input-bg);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚔️ KdF Prompt Generator</h1>
        <p class="subtitle">Random constraints for creative solo drills</p>
    </div>

    <div class="card">
        <button onclick="generatePrompt()">🎲 Generate Elements </button>

        <div id="output" style="display: none;">
            <div class="prompt-container">
                <div class="prompt-box">
                    <div class="prompt-label">1. Starting Stance</div>
                    <div class="prompt-value" id="stanceVal">-</div>
                </div>

                <div class="prompt-box">
                    <div class="prompt-label">2. Required Footwork</div>
                    <div class="prompt-value" id="footworkVal">-</div>
                </div>

                <div class="prompt-box">
                    <div class="prompt-label">3. Core Strike / Technique</div>
                    <div class="prompt-value" id="strikeVal">-</div>
                </div>
            </div>

            <div class="challenge-note">
                💡 <strong>Your Creative Goal:</strong> Build a practical 2-to-4 step flow around these three requirements!
            </div>

            <button class="copy-btn" onclick="copyPrompt()">📋 Copy Prompt</button>
        </div>
    </div>

    <script>
        const STANCES = [
            "Vom Tag (Right / High Guard)",
            "Vom Tag (Left / High Guard)",
            "Pflug (Right / Plow)",
            "Pflug (Left / Plow)",
            "Ochs (Right / Ox)",
            "Ochs (Left / Ox)",
            "Alber (Fool's Guard)",
            "Nebenhut (Right / Tail)",
            "Nebenhut (Left / Tail)",
            "Zornhut (Wrath Guard)"
        ];

        const FOOTWORK = [
            "Passing Step Forward",
            "Passing Step Backward",
            "Gathering Step Forward",
            "Compass Step Outward (Off-Line)",
            "Triangle Step Left",
            "Triangle Step Right",
            "Explosive Sprint / Lunging Step"
        ];

        const STRIKES = [
            "Zornhau (Wrath Cut)",
            "Krumphau (Crooked Cut)",
            "Zwerchau (Thwart Cut)",
            "Schielhau (Squinting Cut)",
            "Scheitelhau (Scalp Cut)",
            "Oberhau (High Cut)",
            "Unterhau (Low Cut)",
            "Mittelhau (Horizontal Cut)",
            "Stich (Thrust)"
        ];

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generatePrompt() {
            document.getElementById("stanceVal").innerText = getRandom(STANCES);
            document.getElementById("footworkVal").innerText = getRandom(FOOTWORK);
            document.getElementById("strikeVal").innerText = getRandom(STRIKES);

            document.getElementById("output").style.display = "block";
        }

        function copyPrompt() {
            const stance = document.getElementById("stanceVal").innerText;
            const footwork = document.getElementById("footworkVal").innerText;
            const strike = document.getElementById("strikeVal").innerText;

            const text = `⚔️ KdF Creative Prompt\n• Stance: ${stance}\n• Footwork: ${footwork}\n• Strike: ${strike}`;

            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector(".copy-btn");
                btn.innerText = "✅ Copied!";
                setTimeout(() => btn.innerText = "📋 Copy Prompt", 2000);
            });
        }
    </script>
</body>
</html>
